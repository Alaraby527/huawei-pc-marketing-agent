    opening_statement: '你好，我是你的专属华为 PC 选品助手。

      我可以帮你判断一款机型适不适合你的顾客；不知道选哪款时，也可以帮你从知识库筛选候选。

      把「产品型号 + 目标人群 + 使用场景」告诉我，我帮你产出选品结论：选哪台、为什么、每条理由都附知识库依据。

      信息不全我会先追问；资料不足的地方会明确标注，不会编造。

      问题示例：MateBook 14 酷睿 Ultra，给出差办公的人用合适吗？'
