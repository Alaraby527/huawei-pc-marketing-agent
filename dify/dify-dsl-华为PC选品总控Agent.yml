        code: "import json\nimport re\n\ndef _text(raw):\n    if raw is None:\n  \
          \      return \"\"\n    if isinstance(raw, str):\n        return raw\n \
          \   if isinstance(raw, list):\n        parts = []\n        for it in raw:\n\
          \            if isinstance(it, dict):\n                c = it.get(\"content\"\
