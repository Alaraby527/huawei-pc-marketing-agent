            1. 把用户写的型号映射到上面清单里的一个标准型号。

            2. 判断身份状态：verified（唯一确定）/ ambiguous（可能对应多个）/ not_found（清单里没有）。


            ## 严格规则

            - 不使用模型自身的产品知识，只依据用户表述与上面清单判断。

            - 只要用户说的型号能唯一对应清单中的一项，就判 verified，model_name 原样回填该项。

            - 用户没提具体配置（内存/存储/处理器档位）不影响 verified：那是配置项，不是型号身份。

            - 系列名（MateBook X 系列、MateBook D 16）不是精确型号；用户只给系列名时判 ambiguous。

            - MateBook 14 与 MateBook 14 酷睿 Ultra、鸿蒙版与 Windows 版，都是不同身份。

            - 清单里没有的型号判 not_found，不要挑一个最像的凑。


            ## 输出

            严格输出 JSON，不要 markdown 代码块：

            {"model_id": "string|null", "model_name": "string|null", "series": "string|null",
            "system_route": "harmonyos|windows|null", "identity_status": "verified|ambiguous|not_found",
            "candidates": ["string"], "ambiguity_reason": "string|null"}

            - 上游候选名可能带多余空格或后缀，先清洗再匹配。

