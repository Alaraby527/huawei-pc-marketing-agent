          \ if cond:\n        line += \"（\" + cond + \"）\"\n    val = str(f.get(\"\
          value\") or \"\").strip()\n    if val:\n        line += \"：\" + val\n  \
          \  src = f.get(\"source\") or {}\n    doc = (src.get(\"doc\") or \"\").strip()\n\
          \    if doc:\n        line += \"（资料：\" + doc + \"）\"\n    return line\n\n\
          \ndef main(selector: str, need: str, evidence: str, tier: str, coverage:\
          \ float,\n         fact_count: float, gap_count: float) -> dict:\n    \"\
          \"\"Render the selection decision.\n\n    Every number here comes from the\
