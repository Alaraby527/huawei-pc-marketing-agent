          \ or {}\n                doc = d.get(\"document_name\") if isinstance(d,\
          \ dict) else None\n                parts.append(((\"【\" + doc + \"】\") if\
          \ doc else \"\") + str(c))\n            else:\n                parts.append(str(it))\n\
          \        return \"\\n\".join(parts)\n    return str(raw)\n\n\nSCENE_BONUS\
          \ = {\n    \"学生\": [(\"重量\", 1.6, 3), (\"电池\", 60, 2), (\"屏幕\", 13, 1)],\n\
          \    \"新生\": [(\"重量\", 1.6, 3), (\"电池\", 60, 2), (\"屏幕\", 13, 1)],\n   \
          \ \"创作\": [(\"内存\", 32, 2), (\"屏幕\", 13, 2)],\n    \"设计\": [(\"内存\", 32,\
          \ 2), (\"屏幕\", 13, 2)],\n    \"视频\": [(\"内存\", 32, 2), (\"屏幕\", 13, 2)],\n\
          \    \"办公\": [(\"重量\", 1.6, 2), (\"接口\", 0, 2)],\n    \"差旅\": [(\"重量\",\
          \ 1.6, 2), (\"电池\", 60, 2)],\n    \"家庭\": [(\"存储\", 512, 1), (\"屏幕\", 13,\
          \ 1)],\n    \"企业\": [(\"内存\", 16, 1), (\"接口\", 0, 1)],\n}\n\n\ndef main(retrieved,\
          \ slots_json: str) -> dict:\n    retrieved = _text(retrieved)\n    try:\n\
          \        s = json.loads(slots_json or \"{}\")\n    except Exception:\n \
          \       s = {}\n    text = \" \".join(str(s.get(k) or \"\") for k in (\"\
          audience\", \"scenario\"))\n    key = next((k for k in SCENE_BONUS if k\
          \ in text), \"办公\")\n    rows = []\n    for m in re.finditer(r\"(HUAWEI\\\
          s*MateBook[^,，\\n]{0,24}|MateBook[^,，\\n]{0,24})[，,](.{0,400})\", retrieved\
          \ or \"\"):\n        rows.append({\"model_raw\": m.group(1).strip(), \"\
          blob\": m.group(2)})\n\n    def score(r):\n        sc = 0\n        for field,\
          \ threshold, pts in SCENE_BONUS[key]:\n            mm = re.search(field\
          \ + r\"[：:]?\\s*([\\d.]+)\", r[\"blob\"])\n            if mm and float(mm.group(1))\
          \ >= threshold:\n                sc += pts\n        return sc\n\n    ranked\
          \ = sorted(rows, key=lambda r: -score(r))\n    seen, top = set(), []\n \
          \   for r in ranked:\n        n = re.sub(r\"\\s\", \"\", r[\"model_raw\"\
          ])\n        if n and n not in seen:\n            seen.add(n)\n         \
          \   top.append({\"model_name\": r[\"model_raw\"], \"row\": r[\"blob\"][:300]})\n\
          \        if len(top) == 3:\n            break\n    return {\"candidates\"\
          : json.dumps(top, ensure_ascii=False), \"scene_key\": key}\n"
