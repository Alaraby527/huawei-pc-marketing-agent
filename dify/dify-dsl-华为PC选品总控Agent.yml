          \   try:\n            v = json.loads(s[i:])\n            if isinstance(v,\
          \ dict):\n                return v\n        except Exception:\n        \
          \    continue\n    return {}\n\n\ndef fmt_fact(f, prefix=\"- \"):\n    \"\
          \"\"One fact as a line: id, field, label, condition, value, source doc.\"\
          \"\"\n    line = prefix + str(f.get(\"fact_id\") or \"\") + \" \" + str(f.get(\"\
