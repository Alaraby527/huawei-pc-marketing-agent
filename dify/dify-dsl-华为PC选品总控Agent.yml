          \ of this one.\n    \"\"\"\n    sel = load(selector)\n    nd = load(need)\n\
          \    pack = load(evidence)\n\n    model_name = (sel.get(\"model_name\")\
          \ or pack.get(\"model_name\") or \"\").strip()\n    facts = [f for f in\
          \ (pack.get(\"facts\") or []) if isinstance(f, dict)]\n    by_id = {str(f.get(\"\
          fact_id\")): f for f in facts}\n\n    out = [\"一、选品对象\"]\n    out.append(\"\
          - 目标人群：\" + ((nd.get(\"audience\") or \"\").strip() or \"未提供\"))\n    out.append(\"\
          - 使用场景：\" + ((nd.get(\"scenario\") or \"\").strip() or \"未提供（按人群判断）\"))\n\
          \    out.append(\"\")\n\n    out.append(\"二、选品结论\")\n    out.append(\"-\
          \ 推荐型号：\" + (model_name or \"未确定\"))\n    fit = (sel.get(\"fit\") or \"\"\
          ).strip()\n    if fit in FIT_LABEL:\n        out.append(\"- 适配判断：\" + FIT_LABEL[fit])\n\
          \    out.append(\"- 推荐档位：\" + TIER_LABEL.get(tier, tier or \"未定\")\n   \
          \            + \"（覆盖度 \" + str(coverage) + \"，事实 \" + str(int(fact_count\
          \ or 0)) + \" 条）\")\n    reasons = [c for c in (sel.get(\"reasons\") or\
          \ []) if isinstance(c, dict)]\n    if reasons:\n        out.append(\"- 选品理由：\"\
          )\n        n = 0\n        for c in reasons:\n            fid = str(c.get(\"\
          fact_id\") or \"\")\n            f = by_id.get(fid)\n            if not\
          \ f:\n                # A fact id that is not in the pack is a hallucination,\
          \ and\n                # printing it would launder an invented fact into\
          \ the output.\n                continue\n            n += 1\n          \
          \  line = \"  %d. %s %s\" % (n, fid, str(f.get(\"field\") or \"\"))\n  \
          \          label = str(f.get(\"key\") or \"\").strip()\n            cond\
          \ = str(f.get(\"condition\") or \"\").strip()\n            if label and\
