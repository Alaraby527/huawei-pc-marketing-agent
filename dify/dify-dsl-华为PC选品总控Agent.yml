        code: "import json\nimport re\n\n# The knowledge base stores specs three ways,\
          \ and only two of them carry a\n# usable field/value pair:\n#   matrix \
          \ \"MateBook 14 酷睿 Ultra,尺寸；14.2 英寸；类型；OLED,…,源路径\"\n#   colon   \"重量：1.31\
          \ kg\"\n#   tree    one line per node (\"屏幕\" / \"尺寸\" / \"14.2 英寸\") -\
          \ dropped, because\n#           retrieval returns segments by score, so\
          \ the pairs are not adjacent.\nCORE_FIELDS = (\"屏幕\", \"处理器\", \"内存\", \"\
          存储\", \"尺寸重量\", \"电池\", \"接口\")\n# Envelope lines copied from the source\
          \ file; they describe the file, not the product.\nMETA_FIELDS = {\n    \"\
          原始知识库路径\", \"原文 SHA256\", \"资料类别\", \"发布状态\", \"原始发布状态\",\n    \"产品类别\"\
          , \"所属目录\", \"官方页面\", \"抓取日期\", \"品类\", \"资料角色\",\n    \"完整型号或主题\", \"型号或主题\"\
          , \"来源路径\", \"来源\", \"目标知识库\",\n    \"原始资料数\", \"知识层\",\n}\n\n\ndef norm(s):\n\
          \    s = (s or \"\").upper()\n    s = s.replace(\"ＨＵＡＷＥＩ\", \"HUAWEI\").replace(\"\
          华为\", \"\")\n    for ch in (\" \", \"\\u3000\", \"\\t\", \"-\", \"_\", \"\
          ·\"):\n        s = s.replace(ch, \"\")\n    s = s.replace(\"（\", \"(\").replace(\"\
          ）\", \")\")\n    return s.strip()\n\n\n# Column order of 全型号参数联合矩阵.csv:\
          \ 型号 + 12 concerns + 本地事实源.\n# This row shape carries the field name in\
          \ the header, not in the cell, and\n# content-based guessing gets it wrong\
          \ in a way that matters: the 屏幕规格 cell\n# opens with \"尺寸；展开态：18 英寸\", which\
          \ every keyword test reads as a body\n# measurement and files away from\
          \ the screen. Reading the column is exact.\nJOINT_COLUMNS = {\n    1: None,\
          \              # 操作系统\n    2: \"屏幕\",            # 屏幕规格\n    3: \"处理器\"\
          ,\n    4: \"内存\",\n    5: \"存储\",\n    6: \"尺寸重量\",\n    7: \"电池\",\n  \
          \  8: \"接口\",\n    9: None,              # 键盘触控板\n    10: None,        \
          \     # 摄像头\n    11: None,             # 音频\n    12: None,             #\
          \ 特色应用\n}\nJOINT_WIDTH = 1 + len(JOINT_COLUMNS) + 1\n\n# A matrix cell usually\
          \ names its own field, and that label is the most\n# reliable signal in\
          \ the whole row. It is also the only one that works for\n# \"屏幕；18 英寸 3.3K\
          \ 折叠屏\": there is no OLED/IPS/resolution word to match,\n# so without the\
          \ label the row is dropped even though 屏幕 is right there.\nFIELD_ALIAS =\
          \ {\n    \"屏幕\": \"屏幕\", \"显示屏\": \"屏幕\", \"显示\": \"屏幕\",\n    \"处理器\":\
          \ \"处理器\", \"CPU\": \"处理器\", \"芯片\": \"处理器\",\n    \"内存\": \"内存\", \"运行内存\"\
          : \"内存\", \"RAM\": \"内存\",\n    \"存储\": \"存储\", \"硬盘\": \"存储\", \"机身存储\"\
          : \"存储\",\n    \"电池\": \"电池\", \"电池容量\": \"电池\",\n    \"接口\": \"接口\", \"\
          端口\": \"接口\",\n    \"重量\": \"尺寸重量\", \"尺寸\": \"尺寸重量\", \"厚度\": \"尺寸重量\"\
          ,\n    \"尺寸重量\": \"尺寸重量\", \"机身尺寸\": \"尺寸重量\",\n}\n\n\ndef classify(text):\n\
          \    \"\"\"Map a spec blob to one canonical field, or None.\n\n    Order\
          \ matters: a screen cell mentions 尺寸, and a body cell mentions 重量,\n   \
          \ so the unit and the surrounding vocabulary decide, not the first keyword.\n\
          \    \"\"\"\n    t = text\n    # 英寸 first. A screen cell opens with \"尺寸；展开态：18\
          \ 英寸\", and the label\n    # 尺寸 on its own would file the diagonal as a\
          \ body measurement - which then\n    # clashes with the real width and blocks\
          \ the model. No laptop body dimension\n    # is ever quoted in inches.\n\
          \    if \"英寸\" in t and not re.search(r\"\\d\\s*kg|\\d\\s*g\b|\\d\\s*mm\"\
          , t):\n        return \"屏幕\"\n    # Then the cell's own label.\n    head\
          \ = t.split()[0].rstrip(\"；;:：\") if t.strip() else \"\"\n    if head in\
          \ FIELD_ALIAS:\n        return FIELD_ALIAS[head]\n    if re.search(r\"OLED|IPS|LCD|分辨率|屏占比|刷新率|亮度|色域\"\
          , t):\n        return \"屏幕\"\n    if re.search(r\"酷睿|麒麟|锐龙|处理器|CPU\", t):\n\
          \        return \"处理器\"\n    # Body before battery. A weight line often\
          \ says where the battery is\n    # counted (\"约 1.16 kg（含电池,不含键盘）\"), so\
          \ testing 电池 first files the\n    # weight as a battery spec. A real battery\
          \ row carries Wh, never kg/mm.\n    if re.search(r\"重量|宽度|深度|高度|厚度\", t)\
          \ and re.search(r\"kg|\bmm\b|g\b\", t):\n        return \"尺寸重量\"\n    if\
          \ re.search(r\"Wh|锂聚合物|电池\", t):\n        return \"电池\"\n    if re.search(r\"\
          USB|HDMI|Type-C|接口|雷电\", t):\n        return \"接口\"\n    # Storage before\
          \ memory: both read \"16 GB / 1 TB\", and only the storage\n    # column\
          \ carries TB. Checking memory first relabelled every SSD row.\n    if re.search(r\"\
          NVMe|SSD|存储|硬盘|\bTB\b\", t):\n        return \"存储\"\n    if re.search(r\"\
          LPDDR|内存|RAM\", t) or (re.search(r\"\bGB\b\", t) and \"/\" in t):\n    \
          \    return \"内存\"\n    return None\n\n\n\ndef is_url(v):\n    \"\"\"A URL\
          \ in a spec cell is a source pointer, not a product fact.\"\"\"\n    return\
          \ bool(re.match(r\"^https?://\", (v or \"\").strip()))\n\n\ndef split_csv(text):\n\
          \    \"\"\"Split a CSV line, honouring double quotes.\n\n    The matrix\
          \ rows quote a cell when the value itself contains a comma:\n    重量；约 1.16\
          \ kg（含电池,不含键盘）. A plain split(\",\") cuts that value in\n    half, and the\
          \ tail \"不含键盘）\" then reads as a separate cell of its own -\n    while the\
          \ head still contains the word 电池, so the weight gets filed as a\n    battery\
          \ fact.\n\n    Quote characters are consumed rather than kept, so the cell\
          \ that comes out\n    is the value itself and not \"\"宽度\".\n    \"\"\"\n\
          \    out, cur, quoted = [], [], False\n    for ch in text:\n        if ch\
          \ == '\"':\n            quoted = not quoted\n        elif ch == \",\" and\
          \ not quoted:\n            out.append(\"\".join(cur))\n            cur =\
          \ []\n        else:\n            cur.append(ch)\n    out.append(\"\".join(cur))\n\
          \    return out\n\n\ndef pairs(blob):\n    \"\"\"Split a matrix cell such\
          \ as \"宽度；310.8 mm；深度；220.8 mm\" into pairs.\n\n    A fixed even/odd split\
          \ does not survive the real data: one label can own\n    several variant\
          \ values (\"高度；标准屏版：11.9 mm；防窥屏版：11.9 mm\"), which\n    makes the segment\
          \ count odd and shifts every later pair by one - so the\n    label \"宽度\"\
          \ itself ends up stored as a value. Instead walk the segments and\n    treat\
          \ a short segment with no digits or units as the current label, so any\n\
          \    number of values can follow one label.\n    \"\"\"\n    # A stray U+FFFD\
          \ in the source chunk (seen live: \"锂聚合物�容量\")\n    # sits exactly where\
          \ a separator should be. Dropping it fuses two fields\n    # into one value,\
          \ so it is treated as a separator.\n    blob = (blob or \"\").replace(\"\
          �\", \"；\")\n    parts = [p.strip() for p in blob.split(\"；\") if p.strip()]\n\
          \n    def is_label(p):\n        # \"左侧：\" and \"右侧：\" prefix an interface\
          \ value rather than labelling\n        # it, and they are longer than a\
          \ field name, so a bare length test\n        # would drop the whole segment.\
          \ A label never carries a quantity.\n        return (len(p) <= 8\n     \
          \           and not re.search(r\"\\d\", p)\n                and not re.search(r\"\
          OLED|IPS|USB|HDMI|kg|Wh|mm|酷睿|麒麟|锂聚合物\", p)\n                and not p.startswith(\"\
          HUAWEI\")\n                and not re.search(r\"：|:\", p))\n\n    out, key\
          \ = [], \"\"\n    for p in parts:\n        if is_label(p):\n           \
          \ key = p\n            continue\n        out.append((key, p))\n    # A leading\
          \ segment with neither a label nor a quantity (\"折叠态（摄像头在上）\")\n    # qualifies\
          \ the whole cell rather than being one of its values.\n    while len(out)\
          \ > 1 and not out[0][0] and not re.search(r\"\\d\", out[0][1]):\n      \
          \  out.pop(0)\n    # A cell that is nothing but labels carries no fact.\n\
          \    return out\n\n\ndef split_condition(value):\n    \"\"\"Separate a leading\
          \ variant name from the value it qualifies.\n\n    \"展开态：7.6 mm（左）/ 7.3\
          \ mm（右）\" and \"闭合态：14.9 mm\" are the same\n    machine measured in two\
          \ states, not two conflicting heights, so the state\n    belongs to the\
          \ fact's identity. Without this the Fold reported 尺寸重量 as\n    contradictory\
          \ and dropped out of the primary tier.\n\n    Some cells also carry the\
          \ model name in front of the variant\n    (\"HUAWEI MateBook Pro S 标准屏版：11.9\
          \ mm\"); only the trailing word is the\n    condition, so a long prefix\
          \ is reduced to its last token when that token\n    ends in 版 or 态.\n  \
          \  \"\"\"\n    s = (value or \"\").strip()\n    m = re.match(r\"^(.*?)[\\\
          uff1a:]\\s*(.+)$\", s)\n    if not m:\n        return \"\", s\n    head,\
          \ val = m.group(1).strip(), m.group(2).strip()\n    if not re.search(r\"\
          \\d\", val):\n        return \"\", s\n    # \"3:2\" is an aspect ratio,\
          \ not a variant: splitting it produced a fact\n    # with condition \"3\"\
          \ and value \"2\". A real condition is a word, not a digit.\n    if not\
          \ re.search(r\"[^\\d\\s.]\", head):\n        return \"\", s\n    if len(head)\
          \ > 12:\n        tail = re.split(r\"\\s+\", head)\n        if tail and re.search(r\"\
          (版|态)$\", tail[-1]):\n            head = tail[-1]\n        else:\n     \
          \       return \"\", s\n    return head, val\n\n\n# Weight and size cells\
          \ often carry the variant inside parentheses instead of\n# in front of the\
          \ colon: \"约 1.33 kg（圆键盘含电池）\" and \"约 1.32 kg（方键盘含\n# 电池）\" are two keyboard\
          \ options of one machine. Without reading that they\n# look like two contradictory\
          \ weights, and the model drops a tier over a\n# difference that is really\
          \ just which keyboard is in the box.\nPAREN_VARIANT = re.compile(r\"[（(]([^（()）]*(?:键盘|版|态)[^（()）]*)[）)]\"\
          )\n\n\ndef variant_of(value):\n    \"\"\"Return the variant named inside\
          \ the value, or \"\".\n\n    Only the leading word that ends in 键盘/版/态 is\
          \ the variant; the rest of\n    the parenthesis (\"含电池\") is a qualifier\
          \ and must stay in the value.\n    \"\"\"\n    m = PAREN_VARIANT.search(value\
          \ or \"\")\n    if not m:\n        return \"\"\n    m2 = re.match(r\"^([^,，;；]*?(?:键盘|版|态))\"\
          , m.group(1))\n    return m2.group(1).strip() if m2 else \"\"\n\n\ndef main(model_resolution:\
          \ str, need: str, chunks: list) -> dict:\n    \"\"\"Assemble a fact-level\
          \ evidence pack from retrieved knowledge chunks.\n\n    Two rules do the\
          \ real work here:\n      1. A fact must name the resolved model. Rows about\
          \ a sibling model are\n         discarded, not merged - that is the cross-product\
          \ contamination that\n         makes new-SKU copy wrong.\n      2. Retrieval\
          \ score is never promoted to confidence. The same field with\n         two\
          \ different values is marked conflict instead of silently resolved.\n  \
          \  \"\"\"\n    def load(raw):\n        # deepseek-v4 wraps its answer in\
          \ <think>...</think> inside the same\n        # text field, and often leaves\
          \ the closing tag off. json.loads on the\n        # raw string then fails\
          \ and every field silently reads as empty.\n        s = raw or \"\"\n  \
          \      s = re.sub(r\"<think>.*?</think>\", \"\", s, flags=re.S)\n      \
          \  s = re.sub(r\"^```(?:json)?|```$\", \"\", s.strip(), flags=re.M).strip()\n\
          \        try:\n            v = json.loads(s or \"{}\")\n            if isinstance(v,\
          \ dict):\n                return v\n        except Exception:\n        \
          \    pass\n        # Trailing object after an unclosed tag. Scan from the\
          \ last brace\n        # backwards so a nested structure is not mistaken\
          \ for its first child.\n        for i in range(len(s) - 1, -1, -1):\n  \
          \          if s[i] != \"{\":\n                continue\n            try:\n\
          \                v = json.loads(s[i:])\n                if isinstance(v,\
          \ dict):\n                    return v\n            except Exception:\n\
          \                continue\n        return {}\n\n    res = load(model_resolution)\n\
          \    nd = load(need)\n\n    model_id = (res.get(\"model_id\") or \"\").strip()\n\
          \    model_name = (res.get(\"model_name\") or \"\").strip()\n    status\
          \ = res.get(\"identity_status\") or \"not_found\"\n    target = norm(model_name)\n\
          \    # The same machine has two names in the corpus. 全型号参数联合矩阵.csv keys\
          \ the\n    # HarmonyOS models without the suffix (\"HUAWEI MateBook 14\"\
          ), while the\n    # per-model documents and the resolver use the suffixed\
          \ form\n    # (\"HUAWEI MateBook 14（鸿蒙版）\"). An exact match then rejected\
          \ every row\n    # and a real, well-documented model returned an empty pack.\
          \ Accept either\n    # spelling, but only for the names where the pairing\
          \ is verified.\n    # norm() folds full-width brackets to ASCII, so the\
          \ key keeps its parens.\n    ALIASES = {\n        \"HUAWEIMATEBOOK14(鸿蒙版)\"\
          : \"HUAWEIMATEBOOK14\",\n        \"HUAWEIMATEBOOKPRO(鸿蒙版)\": \"HUAWEIMATEBOOKPRO\"\
          ,\n    }\n    target_alts = {target, ALIASES.get(target, target)}\n    target_alts.discard(\"\
          \")\n\n    facts, seen = [], set()\n    rejected = 0\n\n    def add(field,\
          \ value, key, doc, seg, src, quote):\n        # The same spec often appears\
          \ in several segments (full row, then one\n        # column per matrix file).\
          \ Identity is field+value, not segment.\n        value = (value or \"\"\
          ).strip()\n        if not value or is_url(value):\n            return\n\
          \        # The variant (\"展开态\", \"标准屏版\") is part of what distinguishes\
          \ one\n        # fact from another, so it is split out before deduplication.\n\
          \        condition, value = split_condition(value)\n        if not condition:\n\
          \            condition = variant_of(value)\n        if not value:\n    \
          \        return\n        sig = field + \"|\" + condition + \"|\" + re.sub(r\"\
          \\s+\", \"\", value)\n        if sig in seen:\n            return\n    \
          \    seen.add(sig)\n        # A stable, per-fact id. It must be unique or\
          \ the copywriter cannot\n        # cite one claim, the checker cannot map\
          \ a sentence back, and a\n        # per-field id collapses every screen\
          \ fact into a single \"chunk:屏幕\".\n        fid = \"F%02d\" % (len(facts)\
          \ + 1)\n        facts.append({\n            \"fact_id\": fid,\n        \
          \    \"field\": field,\n            \"key\": key,\n            \"condition\"\
          : condition,\n            \"value\": value,\n            \"claim_type\"\
          : \"spec\",\n            \"source\": {\"doc\": doc, \"segment\": seg, \"\
          path\": src, \"quote\": quote[:200]},\n            \"status\": \"confirmed\"\
          ,\n        })\n\n    # Without a resolved model there is nothing to attribute\
          \ a row to. The\n    # guards below are written as `if target and norm(row_model)\
          \ != target`, so\n    # an empty target skips them entirely - and an unknown\
          \ request collected 23\n    # facts belonging to MateBook Pro, X Pro and\
          \ others, then printed them as\n    # \"已确认\". A missing identity must mean\
          \ an empty pack, not everyone's pack.\n    for row in (chunks or []) if\
          \ target_alts else []:\n        if not isinstance(row, dict):\n        \
          \    continue\n        text = (row.get(\"content\") or \"\").strip()\n \
          \       if not text:\n            continue\n        meta = row.get(\"metadata\"\
          ) or {}\n        doc = row.get(\"document_name\") or meta.get(\"document_name\"\
          ) or meta.get(\"source\") or \"\"\n        seg = str(row.get(\"segment_id\"\
          ) or row.get(\"id\") or row.get(\"document_id\") or \"\")\n\n        # ---\
          \ form 1: matrix row \"型号,列1,列2,…,源路径\" ---\n        # Quoted cells are\
          \ kept whole: a comma inside a value is part of the\n        # value, not\
          \ a column boundary.\n        cells = [c.strip() for c in split_csv(text)]\n\
          \        is_matrix = len(cells) >= 3 and re.search(r\"/[^,]*\\.(md|csv)$\"\
          , cells[-1])\n        if is_matrix:\n            row_model, src = cells[0],\
          \ cells[-1]\n            # The row must be about the resolved model. Substring\
          \ matching\n            # either way would let \"MateBook 14\" swallow \"\
          MateBook 14 酷睿 Ultra\".\n            if target_alts and norm(row_model)\
          \ not in target_alts:\n                rejected += 1\n                continue\n\
          \            # Each comma cell is one column, i.e. one concern. Joining\
          \ them\n            # first would merge the OS column into the screen spec.\
          \ Classify\n            # per pair rather than per cell: a single cell can\
          \ still carry two\n            # concerns (\"内存；16 GB；存储；1 TB\").\n    \
          \        #\n            # On the 14-column joint matrix the column index\
          \ is authoritative:\n            # the header names the field, and content\
          \ guessing misfiles the\n            # screen cell (it opens with \"尺寸；…18\
          \ 英寸\") as a body dimension.\n            joint = len(cells) == JOINT_WIDTH\n\
          \            for idx, cell in enumerate(cells[1:-1], start=1):\n       \
          \         col_field = JOINT_COLUMNS.get(idx) if joint else None\n      \
          \          cell_field = col_field or classify(cell)\n                for\
          \ k, v in pairs(cell):\n                    field = col_field or classify(k\
          \ + \" \" + v) or cell_field\n                    if not field:\n      \
          \                  continue\n                    add(field, v, k, doc or\
          \ row_model, seg, src, cell)\n            continue\n\n        # --- form\
          \ 2: \"字段：值\" lines ---\n        # Only accept them from the resolved model's\
          \ own document; a doc named\n        # after a different model is someone\
          \ else's spec sheet.\n        doc_stem = re.sub(r\"\\.md$\", \"\", doc)\n\
          \        if target_alts and doc_stem and not any(a in norm(doc_stem) for\
          \ a in target_alts):\n            rejected += 1\n            continue\n\
          \        for line in text.splitlines():\n            line = line.strip().lstrip(\"\
          -*\\u2022 \").strip()\n            if not line or len(line) > 400:\n   \
          \             continue\n            m = re.match(r\"^([^\\uff1a:]{1,24})[\\\
          uff1a:]\\s*(.+)$\", line)\n            if not m:\n                continue\n\
          \            k, v = m.group(1).strip(), m.group(2).strip()\n           \
          \ if not v or k in META_FIELDS:\n                continue\n            #\
          \ A summary line such as \"本卡的检索结论是：…\" has the shape of a\n           \
          \ # field but is prose: the key is a sentence and the value is a\n     \
          \       # paragraph. Filing one produced a 处理器 fact whose value was an\n\
          \            # entire review, of a different model.\n            if re.search(r\"\
          的|是\", k) or len(k) > 12 or len(v) > 160:\n                continue\n  \
          \          field = classify(k + \" \" + v) or k\n            add(field,\
          \ v, k, doc, seg, \"\", line)\n\n    # Same field + same key, two values:\
          \ keep both and block the field.\n    # Enumeration is not conflict: a model\
          \ really does ship with two CPU\n    # options and four ports, and flagging\
          \ that would block every valid SKU.\n    # Only single-valued keys can contradict\
          \ each other.\n    ENUMERABLE = {\"处理器\", \"接口\", \"存储\", \"内存\"}\n    by_field\
          \ = {}\n    for f in facts:\n        by_field.setdefault(f[\"field\"], []).append(f)\n\
          \    conflicts = []\n    gaps = []\n    for field, items in by_field.items():\n\
          \        if field in ENUMERABLE:\n            continue\n        # A value\
          \ that names its own variant (\"标准屏版：11.9 mm\", \"典藏版：12.2 mm\")\n     \
          \   # is the source documenting several SKUs in one row, not a contradiction.\n\
          \        # Read the number out of it: if the variants agree (both 11.9 mm\
          \ here)\n        # there is nothing to confirm, and treating it as a conflict\
          \ dropped the\n        # whole model to alternative.\n        by_key = {}\n\
          \        for f in items:\n            if not f[\"key\"]:\n             \
          \   continue\n            num = re.search(r\"[-+]?\\d+(?:\\.\\d+)?\\s*(?:mm|kg|g|Wh|英寸|%)\"\
          , f[\"value\"])\n            v = num.group(0).replace(\" \", \"\") if num\
          \ else re.sub(r\"\\s+\", \"\", f[\"value\"])\n            # Two states of\
          \ one machine (\"展开态 288.5 mm\" / \"闭合态 193.7 mm\")\n            # are both\
          \ true, so compare within a condition, never across it.\n            by_key.setdefault((f[\"\
          key\"], f[\"condition\"]), set()).add(v)\n        clashing = [k for k, vals\
          \ in by_key.items() if len(vals) > 1]\n        if clashing:\n          \
          \  conflicts.append(field)\n            gaps.append(field + \" 存在多个不同取值，需确认版本或配置\"\
          )\n            hit = set(clashing)\n            for f in items:\n      \
          \          if (f[\"key\"], f[\"condition\"]) in hit:\n                 \
          \   f[\"status\"] = \"conflict\"\n\n\n    present = set(by_field)\n    for\
          \ field in CORE_FIELDS:\n        if field not in present:\n            gaps.append(\"\
          未检索到 \" + field)\n\n    # A missing scene does not block the recommendation,\
          \ but the fitness\n    # judgement then rests on the audience alone, and\
          \ downstream must not\n    # invent a scene to fill the hole. Recorded as\
          \ an explicit gap.\n    if not (nd.get(\"scenario\") or \"\").strip():\n\
          \        gaps.insert(0, \"未提供使用场景，选品仅按人群判断\")\n\n    confirmed = [f for\
          \ f in facts if f[\"status\"] == \"confirmed\"]\n    coverage = round(min(1.0,\
          \ len(present) / float(len(CORE_FIELDS))), 2)\n    if status != \"verified\"\
          :\n        gaps.insert(0, \"型号身份未唯一确定，需先澄清型���\")\n        coverage = 0.0\n\
          \    elif not facts:\n        gaps.insert(0, \"检索到的分块没有可解析的规格字段，需检查知识库分块格式\"\
          )\n\n    # Tier is computed here, never by the LLM, so it cannot be talked\
          \ upward.\n    if coverage >= 0.6 and not conflicts and status == \"verified\"\
          :\n        tier = \"primary\"\n    elif coverage >= 0.3 and status == \"\
          verified\":\n        tier = \"alternative\"\n    else:\n        tier = \"\
          watch\"\n\n    pack = {\n        \"model_id\": model_id,\n        \"model_name\"\
          : model_name,\n        \"identity_status\": status,\n        \"audience\"\
          : nd.get(\"audience\"),\n        \"scenario\": nd.get(\"scenario\"),\n \
          \       \"facts\": facts,\n        \"confirmed_count\": len(confirmed),\n\
          \        \"fields_present\": sorted(present),\n        \"fields_missing\"\
          : [f for f in CORE_FIELDS if f not in present],\n        \"rejected_cross_model\"\
          : rejected,\n        \"gaps\": gaps,\n        \"conflicts\": conflicts,\n\
          \        \"coverage\": coverage,\n        \"tier\": tier,\n    }\n    return\
          \ {\n        \"output\": json.dumps(pack, ensure_ascii=False),\n       \
          \ \"tier\": tier,\n        \"coverage\": coverage,\n        \"fact_count\"\
          : len(facts),\n        \"gap_count\": len(gaps),\n    }\n"
