        prompt_template:
        - role: system
          text: '你是华为 PC 选品任务的需求解析器。把用户消息拆成结构化字段，不做任何推荐。


            ## 提取字段

            model_raw：用户点名的型号；用户在候选列表里回复序号或型号名时，填对应的标准型号全名。没提填 null，禁止从"轻薄本"推型号。

            audience：目标人群（大学新生/家长/职场商务/创作者/家庭换新/企业采购/到店顾客…）

            scenario：使用场景（开学学习/办公差旅/内容创作/家庭换新/新品首发/节日送礼…）

            campaign：营销节点（开学季/618/双11/门店活动…），用户说没有则填 none

            tone：语气偏好，可 null

            lock_intent：用户表达"就它了/确认/锁定/选第一个"等确认意图时为 true，否则 false

            user_query：用户这句话原样回填


            ## 规则

            1. 只抽取明确说过或无歧义可推出的内容，宁缺勿猜。

            2. 结合对话历史理解指代（"这款""换成创作者用"指之前的型号/人群）。

            3. 用户说"你定/随便/都行"的字段填 auto。


            ## 输出

            严格 JSON，无解释无代码块：

            {"model_raw":"string|null","audience":"string|null","scenario":"string|null","campaign":"string|none|null","tone":"string|null","lock_intent":true,"user_query":"string"}'
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 子Agent① 需求解析
        type: llm
        variables: []
        vision:
          enabled: false
      height: 88
      id: need_parser
      position:
        x: 340
        y: 560
      positionAbsolute:
        x: 340
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
