      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef _load(raw):\n    s = raw or \"\"\n  \
          \  s = re.sub(r\"<think>.*?</think>\", \"\", s, flags=re.S)\n    if \"<think>\"\
          \ in s:\n        tail = s.rsplit(\"<think>\", 1)[1]\n        m = re.search(r\"\
          \\\\{.*\\\\}\\\\s*$\", tail, re.S)\n        s = m.group(0) if m else \"\"\
          \n    fence = chr(96) * 3\n    s = re.sub(fence + r\"(?:json)?\\\\s*|\\\\\
          s*\" + fence, \"\", s).strip()\n    try:\n        v = json.loads(s)\n  \
          \      if isinstance(v, dict):\n            return v\n    except Exception:\n\
          \        pass\n    for i in range(len(s) - 1, -1, -1):\n        if s[i]\
          \ != \"{\":\n            continue\n        try:\n            v = json.loads(s[i:])\n\
          \            if isinstance(v, dict):\n                return v\n       \
          \ except Exception:\n            continue\n    return {}\n\nLOCK_RE = re.compile(r\"\
          (就它了|就这台|确认|锁定|就选|选第[一二三]|定了)\")\n\n\ndef main(raw: str, slots_prev: str,\
          \ clarify_prev: float, user_query: str) -> dict:\n    data = _load(raw)\n\
          \    prev = {}\n    try:\n        v = json.loads(slots_prev or \"{}\")\n\
          \        if isinstance(v, dict):\n            prev = v\n    except Exception:\n\
          \        prev = {}\n\n    def get(k):\n        val = data.get(k)\n     \
          \   if isinstance(val, str):\n            val = val.strip()\n        if\
          \ val in (None, \"null\", \"\"):\n            return \"\"\n        return\
          \ val\n\n    slots = dict(prev)\n    for k in (\"model_raw\", \"audience\"\
          , \"scenario\", \"campaign\", \"tone\"):\n        v = get(k)\n        if\
          \ v == \"auto\":\n            slots.setdefault(k, \"auto\")\n        elif\
          \ v:\n            slots[k] = v\n\n    uq = str(get(\"user_query\") or user_query\
          \ or \"\")\n    try:\n        cnt = int(clarify_prev or 0)\n    except Exception:\n\
          \        cnt = 0\n    want_lock = (get(\"lock_intent\") is True) or bool(LOCK_RE.search(uq\
          \ or \"\"))\n\n    missing = [k for k in (\"audience\", \"scenario\") if\
          \ not slots.get(k)]\n    forced = bool(missing) and cnt >= 3\n    if forced:\n\
          \        slots.setdefault(\"audience\", \"auto\")\n        slots.setdefault(\"\
          scenario\", \"auto\")\n        missing = []\n\n    return {\n        \"\
          slots_json\": json.dumps(slots, ensure_ascii=False),\n        \"missing_text\"\
          : \" / \".join(missing) if missing else \"\",\n        \"is_complete\":\
          \ not missing,\n        \"has_model\": bool(slots.get(\"model_raw\")),\n\
          \        \"want_lock\": want_lock,\n        \"clarify_count\": cnt + 1 if\
          \ missing else cnt,\n        \"user_query\": uq,\n        \"forced_note\"\
          : \"已按默认设定继续（追问达上限）\" if forced else \"\",\n    }\n"
        code_language: python3
        desc: ''
        outputs:
