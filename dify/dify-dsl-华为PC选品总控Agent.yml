    - data:
        code: "def _text(raw):\n    if raw is None:\n        return \"\"\n    if isinstance(raw,\
          \ str):\n        return raw\n    if isinstance(raw, list):\n        parts\
          \ = []\n        for it in raw:\n            if isinstance(it, dict):\n \
          \               c = it.get(\"content\") or it.get(\"text\") or \"\"\n  \
          \              d = it.get(\"metadata\") or {}\n                doc = d.get(\"\
          document_name\") if isinstance(d, dict) else None\n                parts.append(((\"\
          【\" + doc + \"】\") if doc else \"\") + str(c))\n            else:\n    \
          \            parts.append(str(it))\n        return \"\\n\".join(parts)\n\
          \    return str(raw)\n\n\ndef main(scene_hits, price_hits) -> dict:\n  \
          \  scene_hits = _text(scene_hits)\n    price_hits = _text(price_hits)\n\
          \    def first_lines(raw, n):\n        lines = [ln.strip() for ln in (raw\
          \ or \"\").splitlines() if ln.strip()]\n        return \"；\".join(lines[:n])\n\
          \    parts = []\n    scene = first_lines(scene_hits, 3)\n    if scene:\n\
          \        parts.append(\"场景话术参考（仅作切入点，不得当产品参数）：\" + scene[:300])\n    price\
          \ = first_lines(price_hits, 2)\n    if price:\n        parts.append(\"历史价格快照（仅历史参考，禁止当期报价，以门店为准）：\"\
          \ + price[:200])\n    return {\"output\": (\"参考信息：\\n\" + \"\\n\".join(\"\
          - \" + p for p in parts)) if parts else \"\"}\n"
