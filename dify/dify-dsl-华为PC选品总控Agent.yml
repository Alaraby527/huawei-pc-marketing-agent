          \ + label\n            if cond:\n                line += \"（\" + cond +\
          \ \"）\"\n            val = str(f.get(\"value\") or \"\").strip()\n     \
          \       if val:\n                line += \"：\" + val\n            why =\
          \ (c.get(\"why\") or \"\").strip()\n            if why:\n              \
          \  line += \"　→ \" + why\n            out.append(line)\n    concerns = [str(x)\
          \ for x in (sel.get(\"concerns\") or []) if str(x).strip()]\n    if concerns:\n\
          \        out.append(\"- 顾虑：\")\n        for c in concerns:\n           \
