services:
  app:
    build: .
    image: huawei-pc-marketing-agent:local
    ports:
      - "7860:7860"
    environment:
      IMA_OPENAPI_CLIENTID: ${IMA_OPENAPI_CLIENTID:-}
      IMA_OPENAPI_APIKEY: ${IMA_OPENAPI_APIKEY:-}
      IMA_KB_NAME: ${IMA_KB_NAME:-}
      KB_SOURCE: ${KB_SOURCE:-ima}
      LOCAL_KB_ZIP: ${LOCAL_KB_ZIP:-/app/data/official-kb-v7.zip}
      LOCAL_KB_NAME: ${LOCAL_KB_NAME:-华为PC全板块深度知识库_v7（本地官方导出）}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_IMAGE_MODEL: ${LLM_IMAGE_MODEL:-wanx2.1-t2i-turbo}
      LLM_IMAGE_SIZE: ${LLM_IMAGE_SIZE:-768*1024}
      ENABLE_AI_COVER: ${ENABLE_AI_COVER:-1}
    restart: unless-stopped
