          \ = {\n    \"suitable\": \"适合\",\n    \"marginal\": \"勉强���合\",\n    \"\
          unsuitable\": \"不适合\",\n}\n\n\ndef load(raw):\n    \"\"\"Parse model JSON\
          \ that may be wrapped in <think> or a code fence.\"\"\"\n    s = raw or\
          \ \"\"\n    s = re.sub(r\"<think>.*?</think>\", \"\", s, flags=re.S)\n \
          \   s = re.sub(r\"```(?:json)?\\s*|\\s*```\", \"\", s).strip()\n    try:\n\
          \        v = json.loads(s)\n        if isinstance(v, dict):\n          \
          \  return v\n    except Exception:\n        pass\n    for i in range(len(s)\
