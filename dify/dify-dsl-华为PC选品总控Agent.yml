    - data:
        code: "import json\nimport re\n\n\ndef load(raw):\n    s = raw or \"\"\n \
          \   s = re.sub(r\"<think>.*?</think>\", \"\", s, flags=re.S)\n    s = re.sub(r\"\
          ```(?:json)?\\s*|\\s*```\", \"\", s).strip()\n    try:\n        v = json.loads(s)\n\
          \        if isinstance(v, dict):\n            return v\n    except Exception:\n\
          \        pass\n    for i in range(len(s) - 1, -1, -1):\n        if s[i]\
          \ != \"{\":\n            continue\n        try:\n            v = json.loads(s[i:])\n\
          \            if isinstance(v, dict):\n                return v\n       \
          \ except Exception:\n            continue\n    return {}\n\n\ndef fmt_fact(f,\
          \ prefix=\"- \"):\n    \"\"\"One fact as a line: id, field, label, condition,\
          \ value, source doc.\"\"\"\n    line = prefix + str(f.get(\"fact_id\") or\
          \ \"\") + \" \" + str(f.get(\"field\") or \"\")\n    label = str(f.get(\"\
          key\") or \"\").strip()\n    cond = str(f.get(\"condition\") or \"\").strip()\n\
          \    if label and label != str(f.get(\"field\") or \"\"):\n        line\
          \ += \"·\" + label\n    if cond:\n        line += \"（\" + cond + \"）\"\n\
          \    val = str(f.get(\"value\") or \"\").strip()\n    if val:\n        line\
          \ += \"：\" + val\n    src = f.get(\"source\") or {}\n    doc = (src.get(\"\
          doc\") or \"\").strip()\n    if doc:\n        line += \"（资料：\" + doc + \"\
          ）\"\n    return line\n\n\ndef main(need: str, evidence: str, coverage: float,\
          \ fact_count: float) -> dict:\n    \"\"\"Explain why no recommendation is\
          \ made.\n\n    This branch exists because the rules forbid recommending\
          \ on unconfirmed\n    information. A thin evidence pack is not a reason\
          \ to say something\n    vaguer - it is a reason to stop and say so.\n  \
          \  \"\"\"\n    nd = load(need)\n    pack = load(evidence)\n    model_name\
          \ = (pack.get(\"model_name\") or \"\").strip()\n    facts = [f for f in\
          \ (pack.get(\"facts\") or []) if isinstance(f, dict)]\n    gaps = [str(g)\
          \ for g in (pack.get(\"gaps\") or []) if str(g).strip()]\n    identity =\
          \ (pack.get(\"identity_status\") or \"\").strip()\n\n    out = [\"一、选品对象\"\
          ]\n    out.append(\"- 目标人群：\" + ((nd.get(\"audience\") or \"\").strip()\
          \ or \"未提供\"))\n    out.append(\"- 使用场景：\" + ((nd.get(\"scenario\") or \"\
          \").strip() or \"未提供（按人群判断）\"))\n    if model_name:\n        out.append(\"\
          - 请求型号：\" + model_name)\n    out.append(\"\")\n\n    out.append(\"二、选品结论\"\
          )\n    out.append(\"- 推荐型号：不推荐\")\n    out.append(\"- 原因：该型号已核实的规格不足以支撑推荐\"\
          \n               \"（覆盖度 \" + str(coverage) + \"，事实 \" + str(int(fact_count\
          \ or 0)) + \" 条）\")\n    out.append(\"\")\n\n    out.append(\"三、事实依据\")\n\
          \    if facts:\n        out.append(\"- 已确认（不足以推荐，可作参考）：\")\n        for\
          \ f in facts:\n            out.append(fmt_fact(f, \"  - \"))\n    else:\n\
          \        out.append(\"- 未检索到可解析的规格字段\")\n    out.append(\"\")\n\n    out.append(\"\
          四、下一步\")\n    if gaps:\n        out.append(\"- 待确认信息：\")\n        for g\
          \ in gaps:\n            out.append(\"  - \" + g)\n    else:\n        out.append(\"\
          - 待确认信息：无\")\n    # \"Not enough evidence\" and \"I do not know which product\
          \ you mean\" are\n    # different problems with different fixes. Telling\
          \ someone to upload spec\n    # sheets when the real issue is that \"MateBook\
          \ 14\" names two different\n    # machines sends them to do the wrong work.\n\
          \    if identity == \"ambiguous\":\n        out.append(\"- 下一步：该型号对应多个身份，请指明具体是哪一款后再生成。\"\
          )\n    elif identity == \"not_found\":\n        out.append(\"- 下一步：知识库中没有该型号，请确认型号名称是否正确，或换一个已收录的型号。\"\
          )\n    else:\n        out.append(\"- 下一步：补齐该型号的官方规格资料后重新生成，或换一个资料完整的型号。\"\
          )\n\n    return {\"output\": \"\\n\".join(out).strip()}\n"
